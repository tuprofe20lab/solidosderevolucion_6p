        const NeonCard = ({ children, className = '' }) => (
            <div className={`rounded-[1.6rem] bg-[#140a3a]/75 backdrop-blur-xl border-2 border-white/15 shadow-[0_20px_50px_rgba(0,0,0,0.45)] ${className}`}>{children}</div>
        );

        const Stage3D = ({ children, accent = '#00f0ff', className = '' }) => (
            <div className={`relative rounded-[1.6rem] overflow-hidden border-2 stage-bg ${className}`} style={{ borderColor: accent, boxShadow: `0 0 28px ${accent}55, inset 0 0 60px rgba(0,0,0,0.5)` }}>
                {children}
            </div>
        );

        const NeonRange = ({ label, value, min, max, step = 1, onChange, c1 = '#00f0ff', c2 = '#ff3df2', unit = '' }) => {
            const pct = ((value - min) / (max - min)) * 100;
            return (
                <label className="block">
                    <div className="flex justify-between items-baseline mb-1">
                        <span className="text-white font-black text-sm">{label}</span>
                        <span className="font-black text-lg tabular-nums" style={{ color: c1, textShadow: `0 0 10px ${c1}` }}>{String(value).replace('.', ',')}{unit}</span>
                    </div>
                    <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} className="neon-range w-full"
                        style={{ background: `linear-gradient(90deg, ${c1} 0%, ${c2} ${pct}%, rgba(255,255,255,0.15) ${pct}%)` }} />
                </label>
            );
        };

        // =========================================================================
        // 9. SECCIÓN 1: ¿QUÉ ES UN SÓLIDO DE REVOLUCIÓN?
        // =========================================================================
        function RevolutionSection() {
            const [type, setType] = useState('cilindro');
            const [angle, setAngle] = useState(0);
            const [playing, setPlaying] = useState(true);
            const [confetti, fire] = useConfetti();
            const doneRef = useRef(false);

            useEffect(() => { setAngle(0); setPlaying(true); doneRef.current = false; }, [type]);
            useEffect(() => {
                if (!playing) return;
                let id, last = performance.now();
                const tick = (now) => {
                    const dt = Math.min(0.05, (now - last) / 1000); last = now;
                    setAngle(a => Math.min(360, a + dt * 80));
                    id = requestAnimationFrame(tick);
                };
                id = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(id);
            }, [playing]);
            useEffect(() => {
                if (angle >= 360 && !doneRef.current) {
                    doneRef.current = true; setPlaying(false);
                    AudioController.play('success'); fire();
                }
                if (angle < 360) doneRef.current = false;
            }, [angle]);

            const sol = SOLIDS[type];
            const deg = Math.round(angle);
            const togglePlay = () => {
                AudioController.init(); AudioController.play('pop');
                if (angle >= 360) { setAngle(0); setPlaying(true); } else setPlaying(p => !p);
            };
            const speech = deg >= 360
                ? `¡Listo! El ${sol.figure.toLowerCase()} dio una vuelta completa (360°) y generó un ${sol.name.toUpperCase()}. ${sol.emoji}`
                : deg === 0
                    ? `Mira el ${sol.figure.toLowerCase()} pegado al eje amarillo. ¡Dale play o mueve el deslizador para hacerlo girar!`
                    : `Vamos girando… ${deg}°. Cada punto del ${sol.figure.toLowerCase()} dibuja una circunferencia alrededor del eje.`;

            return (
                <div className="grid lg:grid-cols-[1.35fr_1fr] gap-4 lg:gap-5">
                    {confetti}
                    <Stage3D accent={sol.hex} className="h-[46vh] min-h-[300px] lg:h-[calc(100dvh-11rem)] lg:min-h-[480px]">
                        <Solid3D type={type} r={sol.demo.r} h={sol.demo.h} mode="revolution" sweep={angle}
                            elements={[{ id: 'eje', name: 'Eje de giro', color: EL_COLORS.eje }, { id: 'figura', name: sol.figure, color: sol.figHex }]} autoRotateDefault={false} />
                        <div className="absolute top-3 left-3 z-20 px-3 py-1.5 rounded-2xl bg-black/45 backdrop-blur-md border border-white/20 font-black text-white text-sm sm:text-base">
                            Giro: <span style={{ color: sol.figHex, textShadow: `0 0 10px ${sol.figHex}` }}>{deg}°</span> / 360°
                        </div>
                    </Stage3D>
                    <div className="flex flex-col gap-4">
                        <NeonCard className="p-4 sm:p-5">
                            <h2 className="text-xl sm:text-2xl font-black text-white leading-tight">¿Qué es un <span className="neon-text">sólido de revolución</span>?</h2>
                            <p className="mt-2 text-white/85 font-semibold text-sm sm:text-base leading-relaxed">
                                Es el cuerpo que se forma cuando una <b className="text-[#ff3df2]">figura plana</b> da una vuelta completa (<b className="text-[#ffe600]">360°</b>) alrededor de una recta fija llamada <b className="text-[#ffe600]">eje de giro</b>.
                            </p>
                            <div className="mt-4 text-white/70 text-xs font-black uppercase tracking-wider">Elige la figura que va a girar</div>
                            <div className="mt-2 grid grid-cols-3 gap-2">
                                {SOLID_KEYS.map(k => (
                                    <button key={k} onClick={() => { AudioController.init(); AudioController.play('swoosh'); setType(k); }}
                                        className={`rounded-2xl p-2 sm:p-3 border-2 text-center transition-all active:scale-95 ${type === k ? `bg-gradient-to-br ${SOLIDS[k].grad} border-white text-white shadow-[0_0_20px_rgba(255,255,255,0.35)]` : 'bg-white/10 border-white/20 text-white/85 hover:bg-white/20'}`}>
                                        <FigureIcon type={k} active={type === k} />
                                        <div className="font-black text-[11px] sm:text-sm leading-tight mt-1">{SOLIDS[k].figure}</div>
                                        <div className="text-[10px] sm:text-xs font-bold opacity-90">→ {SOLIDS[k].name}</div>
                                    </button>
                                ))}
                            </div>
                            <p className="mt-3 text-sm font-bold" style={{ color: sol.figHex }}>{sol.figDesc}</p>
                        </NeonCard>
                        <NeonCard className="p-4 sm:p-5">
                            <NeonRange label="Ángulo de giro" value={deg} min={0} max={360} unit="°" c1="#ffe600" c2={sol.figHex}
                                onChange={v => { setPlaying(false); setAngle(v); }} />
                            <div className="mt-3 flex gap-2">
                                <button onClick={togglePlay} className="flex-[2] h-12 rounded-2xl font-black text-white text-sm sm:text-base bg-gradient-to-r from-[#ff2e93] to-[#ff9a00] border-b-4 border-[#b4235f] active:border-b-0 active:translate-y-1 shadow-[0_0_20px_rgba(255,46,147,0.5)] flex items-center justify-center gap-2">
                                    {playing ? <><Pause className="w-5 h-5" /> Pausar</> : angle >= 360 ? <><RotateCcw className="w-5 h-5" /> Girar otra vez</> : <><Play className="w-5 h-5" /> Reproducir</>}
                                </button>
                                <button onClick={() => { AudioController.play('pop'); setPlaying(false); setAngle(0); }} className="flex-1 h-12 rounded-2xl font-black text-white text-sm bg-white/10 border-2 border-white/30 hover:bg-white/20 active:scale-95">0°</button>
                                <button onClick={() => { AudioController.play('pop'); setPlaying(false); setAngle(360); }} className="flex-1 h-12 rounded-2xl font-black text-[#0a0322] text-sm bg-[#c6ff00] border-b-4 border-[#7a9c00] active:border-b-0 active:translate-y-1">360°</button>
                            </div>
                        </NeonCard>
                        <RobotSays text={speech} step={deg >= 360 ? 1 : 0} maxSteps={1} highlight={playing} />
                    </div>
                </div>
            );
        }

        const FigureIcon = ({ type, active }) => {
            const c = active ? '#ffffff' : SOLIDS[type].figHex;
            return (
                <svg viewBox="0 0 60 50" className="w-full h-8 sm:h-10">
                    <line x1="18" y1="2" x2="18" y2="48" stroke="#ffe600" strokeWidth="2.5" strokeDasharray="4 3" />
                    {type === 'cilindro' && <rect x="18" y="10" width="22" height="30" fill={c} fillOpacity="0.55" stroke={c} strokeWidth="2.5" />}
                    {type === 'cono' && <polygon points="18,8 18,42 40,42" fill={c} fillOpacity="0.55" stroke={c} strokeWidth="2.5" />}
                    {type === 'esfera' && <path d="M18 6 A19 19 0 0 1 18 44 Z" fill={c} fillOpacity="0.55" stroke={c} strokeWidth="2.5" />}
                    <path d="M44 16 q10 9 0 18" fill="none" stroke="#ffe600" strokeWidth="2" markerEnd="" />
                    <polygon points="41,32 46,35 45,29" fill="#ffe600" />
                </svg>
            );
        };

        // =========================================================================
        // 10. SECCIÓN 2: ELEMENTOS + MINI-RETO
        // =========================================================================
        const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        function makeQuiz(n = 6) {
            const pool = [];
            SOLID_KEYS.forEach(t => SOLID_ELEMENTS[t].forEach(e => pool.push({ t, id: e.id })));
            return shuffle(pool).slice(0, n).map(q => {
                const others = shuffle(SOLID_ELEMENTS[q.t].filter(e => e.id !== q.id)).slice(0, 3).map(e => e.id);
                return { ...q, options: shuffle([q.id, ...others]) };
            });
        }
        const elName = (t, id) => (SOLID_ELEMENTS[t].find(e => e.id === id) || {}).name || id;

        function ElementsSection() {
            const [type, setType] = useState('cilindro');
            const [mode, setMode] = useState('explore');
            const [hovered, setHovered] = useState(null);
            const [pinned, setPinned] = useState(null);
            const [quiz, setQuiz] = useState(() => makeQuiz());
            const [qi, setQi] = useState(0);
            const [picked, setPicked] = useState(null);
            const [score, setScore] = useState(0);
            const [confetti, fire] = useConfetti();

            const onHover = useCallback((id) => { setHovered(prev => { if (id && id !== prev) AudioController.play('hover'); return id; }); }, []);
            const onPick = useCallback((id) => { AudioController.init(); AudioController.play('pop'); setPinned(prev => (prev === id ? null : id)); }, []);
            useEffect(() => { setHovered(null); setPinned(null); }, [type]);

            const els = SOLID_ELEMENTS[type];
            const activeId = hovered || pinned;
            const info = els.find(e => e.id === activeId);
            const sol = SOLIDS[type];

            const q = quiz[qi];
            const finished = qi >= quiz.length;
            const startQuiz = () => { AudioController.init(); AudioController.play('swoosh'); setQuiz(makeQuiz()); setQi(0); setPicked(null); setScore(0); setMode('reto'); };
            const answer = (id) => {
                if (picked) return;
                setPicked(id);
                if (id === q.id) { setScore(s => s + 1); AudioController.play('success'); }
                else AudioController.play('pop-reverse');
            };
            const nextQ = () => {
                AudioController.play('pop');
                const n = qi + 1; setQi(n); setPicked(null);
                if (n >= quiz.length) { fire(); AudioController.play('success'); }
            };

            const view3D = mode === 'reto' && !finished
                ? <Solid3D key="reto" type={q.t} r={SOLIDS[q.t].demo.r} h={SOLIDS[q.t].demo.h} active={[q.id]} showLabels={false} elements={[]} />
                : <Solid3D key="exp" type={type} r={sol.demo.r} h={sol.demo.h} active={activeId ? [activeId] : []} elements={els.filter(e => e.id !== 'lateral' && e.id !== 'superficie' || true)} onHover={onHover} onPick={onPick} />;
            const accent = mode === 'reto' && !finished ? SOLIDS[q.t].hex : sol.hex;

            return (
                <div className="grid lg:grid-cols-[1.35fr_1fr] gap-4 lg:gap-5">
                    {confetti}
                    <Stage3D accent={accent} className="h-[46vh] min-h-[300px] lg:h-[calc(100dvh-11rem)] lg:min-h-[480px]">
                        {view3D}
                        {mode === 'reto' && !finished && (
                            <div className="absolute top-3 left-3 z-20 px-3 py-1.5 rounded-2xl bg-black/50 backdrop-blur-md border border-white/20 font-black text-white text-sm">
                                {SOLIDS[q.t].emoji} {SOLIDS[q.t].name}
                            </div>
                        )}
                    </Stage3D>
                    <div className="flex flex-col gap-4">
                        <div className="flex gap-2">
                            <Pill active={mode === 'explore'} onClick={() => { AudioController.play('pop'); setMode('explore'); }} grad="from-[#00f5ff] to-[#3a5bff]">🔍 Explorar</Pill>
                            <Pill active={mode === 'reto'} onClick={startQuiz} grad="from-[#ff2e93] to-[#ff9a00]">🎯 Mini-reto</Pill>
                        </div>
                        {mode === 'explore' ? (
                            <>
                                <SolidPicker value={type} onChange={setType} />
                                <NeonCard className="p-4">
                                    <div className="text-white/70 text-xs font-black uppercase tracking-wider mb-2">Toca o pasa el mouse por cada elemento</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {els.map(e => {
                                            const c = elColor(type, e.id); const on = activeId === e.id;
                                            return (
                                                <button key={e.id} onMouseEnter={() => onHover(e.id)} onMouseLeave={() => onHover(null)} onClick={() => onPick(e.id)}
                                                    className="text-left px-3 py-2 rounded-xl border-2 font-black text-xs sm:text-sm transition-all active:scale-95"
                                                    style={{ borderColor: c, background: on ? c : 'rgba(255,255,255,0.06)', color: on ? '#0a0322' : '#fff', boxShadow: on ? `0 0 18px ${c}` : 'none' }}>
                                                    <span className="inline-block w-2.5 h-2.5 rounded-full mr-1.5 align-middle" style={{ background: on ? '#0a0322' : c }} />{e.name}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-3 min-h-[4.5rem] rounded-xl p-3 border-2 bg-black/25" style={{ borderColor: info ? elColor(type, info.id) : 'rgba(255,255,255,0.15)' }}>
                                        {info ? (<><div className="font-black text-base" style={{ color: elColor(type, info.id) }}>{info.name}</div><div className="text-white/90 font-semibold text-sm leading-snug">{info.desc}</div></>)
                                            : <div className="text-white/70 font-semibold text-sm">Elige un elemento para verlo brillar en el {sol.name.toLowerCase()} 3D. ¡También puedes tocarlo directamente en la figura!</div>}
                                    </div>
                                </NeonCard>
                                <RobotSays text={info ? `✨ ${info.name}: ${info.desc}` : `Este es el ${sol.name.toLowerCase()}. ¡Gíralo con el dedo o el mouse y descubre todos sus elementos!`} highlight={!!info} />
                            </>
                        ) : finished ? (
                            <NeonCard className="p-6 text-center">
                                <div className="text-5xl">{score >= 5 ? '🏆' : score >= 3 ? '🌟' : '💪'}</div>
                                <div className="mt-2 text-2xl font-black text-white">¡Reto terminado!</div>
                                <div className="mt-1 text-4xl font-black neon-text">{score} / {quiz.length}</div>
                                <p className="mt-2 text-white/85 font-bold">{score >= 5 ? '¡Excelente! Conoces muy bien los elementos.' : score >= 3 ? '¡Muy bien! Repasa los que fallaste y vuelve a intentarlo.' : '¡Tú puedes! Explora otra vez los sólidos y juega de nuevo.'}</p>
                                <button onClick={startQuiz} className="mt-4 h-12 px-6 rounded-2xl font-black text-white bg-gradient-to-r from-[#ff2e93] to-[#ff9a00] border-b-4 border-[#b4235f] active:border-b-0 active:translate-y-1">🔁 Jugar otra vez</button>
                            </NeonCard>
                        ) : (
                            <>
                                <NeonCard className="p-4 sm:p-5">
                                    <div className="flex justify-between items-center">
                                        <span className="text-white/70 text-xs font-black uppercase tracking-wider">Pregunta {qi + 1} de {quiz.length}</span>
                                        <span className="px-2.5 py-1 rounded-full bg-[#c6ff00] text-[#0a0322] font-black text-xs">⭐ {score}</span>
                                    </div>
                                    <div className="mt-2 text-lg sm:text-xl font-black text-white">¿Cómo se llama el elemento que está <span className="neon-text">brillando</span> en el {SOLIDS[q.t].name.toLowerCase()}? ✨</div>
                                    <div className="mt-3 grid grid-cols-2 gap-2">
                                        {q.options.map(id => {
                                            const isOk = picked && id === q.id, isBad = picked === id && id !== q.id;
                                            return (
                                                <button key={id} onClick={() => answer(id)} disabled={!!picked}
                                                    className={`px-3 py-3 rounded-2xl border-2 font-black text-sm transition-all active:scale-95 ${isOk ? 'bg-[#39ff14] text-[#0a0322] border-white shadow-[0_0_20px_#39ff14]' : isBad ? 'bg-[#ff2e63] text-white border-white animate-pulse' : 'bg-white/10 text-white border-white/25 hover:bg-white/20'} ${picked && !isOk && !isBad ? 'opacity-50' : ''}`}>
                                                    {isOk ? '✅ ' : isBad ? '❌ ' : ''}{elName(q.t, id)}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {picked && (
                                        <button onClick={nextQ} className="mt-3 w-full h-12 rounded-2xl font-black text-white bg-gradient-to-r from-[#00c2ff] to-[#7c3aed] border-b-4 border-[#4c1d95] active:border-b-0 active:translate-y-1 flex items-center justify-center gap-1">
                                            {qi + 1 < quiz.length ? 'Siguiente pregunta' : 'Ver mi resultado'} <ChevronRight className="w-5 h-5" />
                                        </button>
                                    )}
                                </NeonCard>
                                <RobotSays highlight={!picked}
                                    text={!picked ? 'Observa bien la figura 3D: puedes girarla para ver mejor qué parte brilla.' : picked === q.id ? `¡Correcto! ${(SOLID_ELEMENTS[q.t].find(e => e.id === q.id) || {}).desc}` : `¡Casi! Era: ${elName(q.t, q.id)}. ${(SOLID_ELEMENTS[q.t].find(e => e.id === q.id) || {}).desc}`}
                                    step={picked === q.id ? 1 : 0} maxSteps={1} />
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 11. SECCIÓN 3: ¡A CALCULAR! (LABORATORIO EN VIVO + EJEMPLOS PASO A PASO)
        // =========================================================================
        function CalcLab({ type }) {
            const [r, setR] = useState(3);
            const [h, setH] = useState(5);
            const [hl, setHl] = useState(null);
            const rows = calcSolid(type, r, type === 'esfera' ? 2 * r : h);
            const sol = SOLIDS[type];
            const hlRow = rows.find(x => x.key === hl);
            return (
                <div className="grid lg:grid-cols-[1.1fr_1fr] gap-4 lg:gap-5">
                    <div className="flex flex-col gap-3">
                        <Stage3D accent={sol.hex} className="h-[40vh] min-h-[280px] lg:h-[calc(100dvh-21rem)] lg:min-h-[340px]">
                            <Solid3D type={type} r={r} h={type === 'esfera' ? 2 * r : h} active={hlRow ? hlRow.hl : []}
                                elements={SOLID_ELEMENTS[type].filter(e => ['radio', 'altura', 'generatriz'].includes(e.id))} />
                        </Stage3D>
                        <NeonCard className="p-4 grid sm:grid-cols-2 gap-4">
                            <NeonRange label="Radio (r)" value={r} min={1} max={10} unit=" cm" c1={EL_COLORS.radio} c2="#ffe600" onChange={v => { setR(v); AudioController.play('hover'); }} />
                            {type !== 'esfera'
                                ? <NeonRange label="Altura (h)" value={h} min={1} max={15} unit=" cm" c1={EL_COLORS.altura} c2="#00f0ff" onChange={v => { setH(v); AudioController.play('hover'); }} />
                                : <div className="text-white/80 text-sm font-bold self-center">En la esfera solo necesitas el <b className="text-[#ff2e63]">radio</b>. ¡Muévelo y mira cómo crecen el área y el volumen!</div>}
                        </NeonCard>
                    </div>
                    <div className="flex flex-col gap-2.5">
                        <div className="text-white/70 text-xs font-black uppercase tracking-wider">Resultados en vivo · usamos <span className="normal-case">π</span> ≈ 3,14 · pasa el dedo o el mouse por cada fila</div>
                        {rows.map(row => {
                            const on = hl === row.key;
                            return (
                                <div key={row.key} onMouseEnter={() => setHl(row.key)} onMouseLeave={() => setHl(null)} onClick={() => setHl(on ? null : row.key)}
                                    className={`math-card cursor-pointer rounded-2xl bg-white px-3 py-2.5 border-[3px] transition-all ${on ? 'scale-[1.02]' : ''}`}
                                    style={{ borderColor: on ? '#ffe600' : 'rgba(255,255,255,0.6)', boxShadow: on ? '0 0 24px rgba(255,230,0,0.6)' : '0 8px 20px rgba(0,0,0,0.3)' }}>
                                    <div className="flex items-center justify-between gap-2 mb-1">
                                        <span className={`px-2 py-0.5 rounded-lg text-[11px] sm:text-xs font-black text-white bg-gradient-to-r ${sol.grad}`}>{row.name}</span>
                                        <MathDisplay latex={row.formula} inline className="text-slate-500" />
                                    </div>
                                    <MathDisplay latex={row.line} />
                                </div>
                            );
                        })}
                        <RobotSays className="mt-1" text={hlRow ? `Mira cómo brilla en el ${sol.name.toLowerCase()}: «${hlRow.name}». Cambia los deslizadores y el resultado se recalcula al instante.` : `Mueve los deslizadores: el ${sol.name.toLowerCase()} cambia de tamaño y las fórmulas se actualizan solas. ⚡`} highlight={!!hlRow} />
                    </div>
                </div>
            );
        }

        function CalcExamples({ type }) {
            const mags = MAGNITUDES[type];
            const [mag, setMag] = useState(mags[0].key);
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [confetti, fire] = useConfetti();
            const listRef = useRef(null);
            useEffect(() => { setMag(MAGNITUDES[type][0].key); setExIdx(0); setStep(0); }, [type]);
            useEffect(() => { setStep(0); }, [mag, exIdx]);
            useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [step, mag, exIdx]);

            const list = (EXAMPLES[type] && EXAMPLES[type][mag]) || EXAMPLES[type][mags[0].key];
            const ex = list[Math.min(exIdx, list.length - 1)];
            const maxS = ex.steps.length - 1;
            const cur = ex.steps[Math.min(step, maxS)];
            const sol = SOLIDS[type];

            const next = () => {
                AudioController.init(); AudioController.startBGM();
                if (step < maxS) { const n = step + 1; setStep(n); if (n === maxS) { AudioController.play('success'); fire(); } else AudioController.play('pop'); }
                else {
                    AudioController.play('swoosh');
                    if (exIdx < list.length - 1) setExIdx(exIdx + 1);
                    else { const mi = mags.findIndex(m => m.key === mag); if (mi < mags.length - 1) { setMag(mags[mi + 1].key); setExIdx(0); } else { setStep(0); } }
                }
            };
            const prev = () => { if (step > 0) { setStep(step - 1); AudioController.play('pop-reverse'); } };
            const miNow = mags.findIndex(m => m.key === mag);
            const nextLabel = step < maxS ? '¡Siguiente paso!' : exIdx < list.length - 1 ? 'Ir al Ejemplo 2' : miNow < mags.length - 1 ? `Ir a: ${mags[miNow + 1].name}` : 'Repetir ejemplo';

            return (
                <div className="grid lg:grid-cols-[1fr_1.25fr] gap-4 lg:gap-5">
                    {confetti}
                    <div className="flex flex-col gap-3">
                        <div className="flex gap-2 overflow-x-auto scrollbar-hide">
                            {mags.map(m => <Pill key={m.key} active={mag === m.key} grad={sol.grad} onClick={() => { AudioController.play('pop'); setMag(m.key); setExIdx(0); }}>{m.name}</Pill>)}
                        </div>
                        <div className="flex gap-2">
                            {list.map((e, i) => <Pill key={i} active={exIdx === i} grad="from-[#ffe600] to-[#ff8a00]" className={exIdx === i ? '!text-[#0a0322]' : ''} onClick={() => { AudioController.play('pop'); setExIdx(i); }}>Ejemplo {i + 1}</Pill>)}
                        </div>
                        <Stage3D accent={sol.hex} className="h-[36vh] min-h-[260px] lg:h-[calc(100dvh-20rem)] lg:min-h-[320px]">
                            <Solid3D type={type} r={ex.r} h={type === 'esfera' ? 2 * ex.r : ex.h} active={cur.hl}
                                elements={SOLID_ELEMENTS[type].filter(e => ['radio', 'altura', 'generatriz'].includes(e.id)).map(e => ({ ...e, name: e.id === 'radio' ? `r = ${ex.r} ${ex.u}` : e.id === 'altura' ? `h = ${ex.h} ${ex.u}` : (type === 'cono' ? `g = ${Math.round(Math.sqrt(ex.r * ex.r + ex.h * ex.h))} ${ex.u}` : `g = h = ${ex.h} ${ex.u}`) }))} />
                        </Stage3D>
                    </div>
                    <div className="relative flex flex-col rounded-[1.6rem] overflow-hidden bg-white border-[5px] border-white shadow-[0_0_0_3px_rgba(255,61,242,0.7),0_25px_55px_rgba(0,0,0,0.5)] min-h-[440px] lg:h-[calc(100dvh-11rem)]">
                        <DrawingCanvas />
                        <div className="shrink-0 bg-[#0a0322] px-4 pt-12 sm:pt-3 pb-3 border-b-4" style={{ borderColor: sol.hex }}>
                            <div className="flex items-center gap-2 sm:pr-64">
                                <span className={`px-2 py-0.5 rounded-lg text-[11px] font-black text-white bg-gradient-to-r ${sol.grad}`}>{sol.emoji} {sol.name} · Ejemplo {exIdx + 1}</span>
                            </div>
                            <div className="mt-1.5 text-lg sm:text-xl font-black text-white">{ex.title}</div>
                            <p className="text-white/90 font-semibold text-sm sm:text-base leading-snug"><RichText text={ex.text} /></p>
                        </div>
                        <div ref={listRef} className="flex-1 overflow-y-auto scrollbar-hide p-3 sm:p-4 space-y-2.5 bg-slate-50 relative">
                            <div className="absolute inset-0 opacity-[0.05] pointer-events-none bg-[radial-gradient(#0f172a_1.5px,transparent_1.5px)] [background-size:20px_20px]" />
                            {ex.steps.slice(0, step + 1).map((s, i) => {
                                const isCur = i === step, isFinal = s.final;
                                return (
                                    <div key={`${type}-${mag}-${exIdx}-${i}`} className={`relative rounded-2xl px-3 py-2 border-2 animate-slideInRight ${isFinal && isCur ? 'bg-gradient-to-r from-[#d9ffe6] to-[#fff9c4] border-[#10b981] animate-finalGlowNeon' : isCur ? 'bg-white border-[#ff3df2] shadow-[0_0_16px_rgba(255,61,242,0.35)]' : 'bg-white/80 border-slate-200'}`}>
                                        <div className={`text-[11px] sm:text-xs font-black mb-0.5 ${isFinal ? 'text-[#047857]' : isCur ? 'text-[#c026d3]' : 'text-slate-400'}`}>{s.badge}</div>
                                        <div className={isFinal ? 'math-final' : isCur ? 'math-current' : 'math-history'}><MathDisplay latex={s.latex} /></div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="shrink-0 bg-gradient-to-b from-[#f5e1ff] to-[#d9c2ff] p-2.5 border-t-[3px] border-white">
                            <RobotSays text={cur.speech} step={step} maxSteps={maxS} highlight={step > 0} className="mb-2" />
                            <div className="flex items-stretch gap-2 h-11">
                                <button onClick={prev} disabled={step === 0} className="flex-[0.8] rounded-l-2xl bg-[#c4b5fd] text-[#3b0764] font-black text-sm border-b-4 border-[#7c3aed] active:border-b-0 active:translate-y-1 disabled:opacity-40 flex items-center justify-center gap-1"><ChevronLeft className="w-5 h-5" /><span className="hidden sm:inline">Atrás</span></button>
                                <div className="bg-[#7c3aed] text-white font-black px-3 text-xs sm:text-sm flex items-center justify-center border-b-4 border-[#4c1d95] whitespace-nowrap">Paso {step + 1}/{maxS + 1}</div>
                                <button onClick={next} className={`flex-[2] rounded-r-2xl text-white font-black text-xs sm:text-sm border-b-4 active:border-b-0 active:translate-y-1 flex items-center justify-center gap-1 ${step === maxS ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse' : 'bg-gradient-to-r from-[#ff2e93] to-[#ff9a00] border-[#b4235f]'}`}>{nextLabel}<ChevronRight className="w-5 h-5" /></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CalcSection() {
            const [type, setType] = useState('cilindro');
            const [sub, setSub] = useState('ej');
            return (
                <div className="flex flex-col gap-3">
                    <div className="flex flex-wrap gap-2 items-center justify-between">
                        <SolidPicker value={type} onChange={setType} />
                        <div className="flex gap-2">
                            <Pill active={sub === 'ej'} onClick={() => { AudioController.play('pop'); setSub('ej'); }} grad="from-[#ffe600] to-[#ff8a00]" className={sub === 'ej' ? '!text-[#0a0322]' : ''}>📝 Ejemplos paso a paso</Pill>
                            <Pill active={sub === 'lab'} onClick={() => { AudioController.play('pop'); setSub('lab'); }} grad="from-[#c6ff00] to-[#00d68f]" className={sub === 'lab' ? '!text-[#0a0322]' : ''}>🧪 Laboratorio en vivo</Pill>
                        </div>
                    </div>
                    {sub === 'lab' ? <CalcLab key={type} type={type} /> : <CalcExamples key={type} type={type} />}
                </div>
            );
        }

        // =========================================================================
        // 12. APLICACIÓN PRINCIPAL
        // =========================================================================
        const TABS = [
            { key: 'rev', short: '¿Qué es?', title: '1 · ¿Qué es?', grad: 'from-[#00f5ff] to-[#3a5bff]' },
            { key: 'elem', short: 'Elementos', title: '2 · Elementos', grad: 'from-[#ff2e93] to-[#b14bff]' },
            { key: 'calc', short: '¡A calcular!', title: '3 · ¡A calcular!', grad: 'from-[#ffe600] to-[#ff8a00]' }
        ];

        const BrandBadge = ({ onClick, small }) => (
            <button onClick={onClick} className={`inline-flex items-center gap-2 rounded-2xl border-2 border-[#ffe600] bg-white/10 backdrop-blur-md text-[#ffe600] font-black uppercase tracking-wider shadow-[0_0_16px_rgba(255,230,0,0.45)] ${small ? 'px-2.5 py-1.5 text-[11px] sm:text-xs' : 'px-4 py-2 text-xs sm:text-base'}`}>
                <Rocket className={small ? 'w-4 h-4' : 'w-5 h-5'} /> TuProfe20 Lab
            </button>
        );

        function App() {
            const [view, setView] = useState('home');
            const [tab, setTab] = useState('rev');
            const [muted, setMuted] = useState(false);
            const go = (t) => { AudioController.init(); AudioController.startBGM(); AudioController.play('swoosh'); setTab(t); setView('lab'); window.scrollTo(0, 0); };
            const toggleMute = () => { AudioController.init(); setMuted(AudioController.toggleMute()); };
            const MuteBtn = (
                <button onClick={toggleMute} title={muted ? 'Activar sonido' : 'Silenciar'} className="w-10 h-10 sm:w-11 sm:h-11 shrink-0 rounded-2xl bg-white/10 border-2 border-white/30 text-white flex items-center justify-center backdrop-blur-md hover:bg-white/20 active:scale-95">
                    {muted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                </button>
            );

            if (view === 'home') {
                const cards = [
                    { t: 'rev', icon: '🌀', title: '¿Qué es un sólido de revolución?', desc: 'Haz girar un rectángulo, un triángulo y un semicírculo 360° y mira nacer el cilindro, el cono y la esfera.', grad: 'from-[#00f5ff] via-[#2979ff] to-[#7c3aed]' },
                    { t: 'elem', icon: '🔦', title: 'Sus elementos', desc: 'Eje, radio, altura, generatriz, bases, vértice, centro… ¡Tócalos y se iluminan en 3D! Incluye un mini-reto.', grad: 'from-[#ff2e93] via-[#ff3df2] to-[#7c3aed]' },
                    { t: 'calc', icon: '🧮', title: '¡A calcular!', desc: 'Área lateral, área total y volumen con 2 ejemplos paso a paso de cada uno y un laboratorio en vivo.', grad: 'from-[#ffe600] via-[#ff8a00] to-[#ff2e63]' }
                ];
                return (
                    <div className="relative min-h-[100dvh] app-bg text-white" onClick={() => { AudioController.init(); }}>
                        <FloatingBackground />
                        <div className="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 py-5 sm:py-8 flex flex-col min-h-[100dvh]">
                            <div className="flex justify-between items-center"><BrandBadge /> {MuteBtn}</div>
                            <div className="text-center mt-6 sm:mt-10">
                                <div className="inline-block px-4 py-1.5 rounded-full bg-white/10 border border-[#00f0ff]/60 text-[#5ff6ff] font-black text-[11px] sm:text-sm tracking-widest uppercase">Geometría del espacio · Aula 2</div>
                                <h1 className="mt-4 font-black leading-[1.05] text-4xl sm:text-6xl lg:text-7xl tracking-tight">
                                    <span className="text-[#ffe600] drop-shadow-[0_0_18px_rgba(255,230,0,0.6)]">TuProfe20 Lab</span>
                                    <span className="text-white/70"> · </span>
                                    <br className="sm:hidden" />
                                    <span className="neon-text-big">Sólidos de revolución</span>
                                </h1>
                                <p className="mt-4 max-w-2xl mx-auto text-white/85 font-bold text-sm sm:text-lg">Descubre cómo una figura plana que gira crea un cuerpo 3D, aprende sus elementos y calcula su área y su volumen. 🚀</p>
                                <div className="mt-5 flex justify-center gap-3 sm:gap-5 text-4xl sm:text-5xl">
                                    {SOLID_KEYS.map((k, i) => <span key={k} className="animate-robotFloat inline-block" style={{ animationDelay: `${i * 0.4}s`, filter: `drop-shadow(0 0 14px ${SOLIDS[k].hex})` }}>{SOLIDS[k].emoji}</span>)}
                                </div>
                            </div>
                            <div className="mt-8 grid sm:grid-cols-3 gap-4">
                                {cards.map((c, i) => (
                                    <button key={c.t} onClick={() => go(c.t)} className={`group text-left p-5 rounded-[1.8rem] bg-gradient-to-br ${c.grad} border-[3px] border-white/60 shadow-[0_18px_40px_rgba(0,0,0,0.45)] hover:-translate-y-1.5 hover:shadow-[0_0_40px_rgba(255,255,255,0.35)] transition-all relative overflow-hidden`}>
                                        <div className="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white/20 blur-xl" />
                                        <div className="flex items-center justify-between">
                                            <span className="px-2.5 py-1 rounded-full bg-black/30 font-black text-xs">Parte {i + 1}</span>
                                            <span className="text-3xl">{c.icon}</span>
                                        </div>
                                        <div className="mt-3 text-xl font-black leading-tight drop-shadow">{c.title}</div>
                                        <div className="mt-1.5 text-sm font-bold text-white/95 leading-snug drop-shadow">{c.desc}</div>
                                        <div className="mt-4 inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white text-[#0a0322] font-black text-sm group-hover:gap-2 transition-all">¡Vamos! <ChevronRight className="w-4 h-4" /></div>
                                    </button>
                                ))}
                            </div>
                            <div className="mt-auto pt-8 text-center text-white/60 font-black text-xs flex items-center justify-center gap-1.5"><Rocket className="w-4 h-4" /> TuProfe20 Lab</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative min-h-[100dvh] app-bg text-white">
                    <FloatingBackground />
                    <div className="relative z-10 max-w-[1500px] mx-auto px-3 sm:px-5 py-3 flex flex-col gap-3">
                        <header className="flex items-center gap-2 sm:gap-3">
                            <button onClick={() => { AudioController.play('swoosh'); setView('home'); }} title="Portada" className="w-10 h-10 sm:w-11 sm:h-11 shrink-0 rounded-2xl bg-white/10 border-2 border-white/30 flex items-center justify-center backdrop-blur-md hover:bg-white/20 active:scale-95"><Home className="w-5 h-5" /></button>
                            <h1 className="flex-1 min-w-0 font-black text-[15px] sm:text-2xl leading-tight">
                                <span className="text-[#ffe600]">TuProfe20 Lab</span> <span className="text-white/60">·</span> <span className="neon-text">Sólidos de revolución</span>
                            </h1>
                            {MuteBtn}
                        </header>
                        <nav className="flex gap-2 overflow-x-auto scrollbar-hide">
                            {TABS.map(t => (
                                <Pill key={t.key} active={tab === t.key} grad={t.grad} onClick={() => go(t.key)} className={tab === t.key && t.key === 'calc' ? '!text-[#0a0322]' : ''}>{t.title}</Pill>
                            ))}
                        </nav>
                        <main>
                            {tab === 'rev' && <RevolutionSection />}
                            {tab === 'elem' && <ElementsSection />}
                            {tab === 'calc' && <CalcSection />}
                        </main>
                        <footer className="py-2 text-center text-white/50 font-black text-[11px] flex items-center justify-center gap-1.5"><Rocket className="w-3.5 h-3.5" /> TuProfe20 Lab</footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
